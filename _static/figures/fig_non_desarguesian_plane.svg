<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 475 218" width="475" height="218" class="euclid-graphic" data-graphic-id="fig_non_desarguesian_plane" data-proposition="S.23">
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-dashed {
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-accent-line {
      stroke: var(--geom-accent);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-assert-line {
      stroke: var(--geom-assert);
      stroke-width: 2.2;
      stroke-dasharray: 6, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-circle {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      fill: none;
    }
    .geom-arc {
      stroke: var(--geom-accent);
      stroke-width: 1.9;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      stroke: var(--geom-assert);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
    }
    .geom-polygon-gnomon {
      fill: var(--geom-accent);
      fill-opacity: 0.14;
      stroke: none;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
    }
    .geom-point-accent {
      fill: var(--geom-accent);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      opacity: 0.85;
      user-select: none;
    }
  </style>
  <line x1="30.00" y1="112.00" x2="450.00" y2="112.00" class="geom-dashed" />
  <line x1="225.00" y1="16.00" x2="225.00" y2="206.00" class="geom-dashed" />
  <ellipse cx="225.00" cy="112.00" rx="135.00" ry="76.00" class="geom-circle" />
  <line x1="25.62" y1="69.22" x2="110.51" y2="71.73" class="geom-bold" />
  <line x1="346.34" y1="78.68" x2="431.23" y2="81.19" class="geom-bold" />
  <line x1="110.51" y1="71.73" x2="346.34" y2="78.68" class="geom-dashed" />
  <path d="M 110.51 71.73 A 175 175 0 0 0 346.34 78.68" class="geom-accent-line" />
  <circle cx="322.20" cy="112.00" r="3.30" class="geom-point-accent" />
  <text x="322.20" y="129.00" text-anchor="middle" class="geom-label">F</text>
  <circle cx="110.51" cy="71.73" r="3.30" class="geom-point" />
  <circle cx="346.34" cy="78.68" r="3.30" class="geom-point" />
  <text x="98.51" y="63.73" text-anchor="middle" class="geom-label">P</text>
  <text x="358.34" y="70.68" text-anchor="middle" class="geom-label">Q</text>
  <text x="140.00" y="168.00" text-anchor="middle" class="geom-label-sm">Ellipse Boundary</text>
  <text x="235.00" y="144.00" text-anchor="middle" class="geom-label-sm">Hilbert Arc</text>
</svg>
