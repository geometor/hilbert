  <line x1="414.95" y1="135.80" x2="278.15" y2="-2.95" class="geom-dashed" />
  <line x1="186.21" y1="159.84" x2="133.31" y2="106.19" class="geom-dashed" />
  <line x1="285.66" y1="149.39" x2="278.15" y2="-2.95" class="geom-assert-line" />
  <line x1="186.21" y1="159.84" x2="181.76" y2="69.68" class="geom-assert-line" />
