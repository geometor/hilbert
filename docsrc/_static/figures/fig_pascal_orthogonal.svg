  <circle cx="285.66" cy="149.39" r="3.30" class="geom-point" />
  <text x="285.66" y="166.39" text-anchor="middle" class="geom-label">B</text>
  <circle cx="414.95" cy="135.80" r="3.30" class="geom-point" />
  <text x="414.95" y="152.80" text-anchor="middle" class="geom-label">C</text>
  <circle cx="133.31" cy="106.19" r="3.30" class="geom-point" />
  <text x="125.31" y="97.19" text-anchor="middle" class="geom-label">C'</text>
  <circle cx="181.76" cy="69.68" r="3.30" class="geom-point" />
  <text x="173.76" y="60.68" text-anchor="middle" class="geom-label">B'</text>
  <circle cx="278.15" cy="-2.95" r="3.30" class="geom-point" />
  <text x="270.15" y="-11.95" text-anchor="middle" class="geom-label">A'</text>
</svg>
