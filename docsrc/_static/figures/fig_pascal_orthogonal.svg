<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 205" width="480" height="205" class="euclid-graphic" data-graphic-id="fig_pascal_orthogonal" data-proposition="S.14">
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-dashed {
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 5, 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-accent-line {
      stroke: var(--geom-accent);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-assert-line {
      stroke: var(--geom-assert);
      stroke-width: 2.2;
      stroke-dasharray: 6, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-circle {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      fill: none;
    }
    .geom-arc {
      stroke: var(--geom-accent);
      stroke-width: 1.9;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
      stroke: var(--geom-assert);
      stroke-width: 2.0;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
    }
    .geom-polygon-gnomon {
      fill: var(--geom-accent);
      fill-opacity: 0.14;
      stroke: none;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
    }
    .geom-point-accent {
      fill: var(--geom-accent);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      opacity: 0.85;
      user-select: none;
    }
  </style>
  <line x1="42.00" y1="175.00" x2="454.73" y2="131.62" class="geom-line" />
