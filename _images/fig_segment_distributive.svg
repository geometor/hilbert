  <circle cx="55.00" cy="99.20" r="3.30" class="geom-point" />
  <text x="41.00" y="103.20" text-anchor="middle" class="geom-label">b</text>
  <circle cx="55.00" cy="25.60" r="3.30" class="geom-point" />
  <text x="33.00" y="29.60" text-anchor="middle" class="geom-label">b+c</text>
  <circle cx="167.00" cy="192.00" r="3.30" class="geom-point" />
  <text x="167.00" y="209.00" text-anchor="middle" class="geom-label">a</text>
  <circle cx="217.40" cy="192.00" r="3.30" class="geom-point" />
  <text x="217.40" y="209.00" text-anchor="middle" class="geom-label">ab</text>
  <circle cx="346.20" cy="192.00" r="3.30" class="geom-point" />
  <text x="336.20" y="209.00" text-anchor="middle" class="geom-label">a(b+c) = ab+ac</text>
  <circle cx="217.40" cy="118.40" r="3.30" class="geom-point" />
  <text x="229.40" y="114.40" text-anchor="middle" class="geom-label">D</text>
</svg>
