[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometor-hilbert"
authors = [{name = "phi ARCHITECT", email = "phi@geometor.com"}]
description = "Scholarly bilingual Book Codex and metamathematical apparatus for David Hilbert's Grundlagen der Geometrie (1899 / 1902)."
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
geometor-hilbert = "geometor.hilbert.compile_codex:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.hilbert.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
